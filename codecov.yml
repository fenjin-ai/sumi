coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        if_not_found: failure
    patch:
      default:
        target: 80%
        threshold: 0%

comment:
  layout: "header, diff, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

# Keep the PR report and checks; avoid annotations that GitHub cannot clear
# after later commits cover a previously missed line.
github_checks:
  annotations: false
