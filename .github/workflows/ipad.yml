name: iPad build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: iPad ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [engine, simulator, device]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache engine sources and platform build
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-ipad
            Engine/TinymistBridge/target
          key: ipad-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/TinymistBridge/Cargo.lock', 'Engine/TinymistBridge/Cargo.toml', 'Engine/TinymistBridge/src/**') }}
          restore-keys: |
            ipad-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.92.0-xcode-26.3-
      - name: Cache Swift package sources
        id: swift-cache
        if: matrix.platform != 'engine'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-packages
          key: ipad-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved', 'iPad/**/Package.resolved') }}
      - name: In-process engine integration
        if: matrix.platform == 'engine'
        run: scripts/test-ipad-engine.sh
      - name: Build native iPad app
        if: matrix.platform != 'engine'
        run: scripts/build-ipad.sh "${{ matrix.platform }}"
      # Save successful compilation before UI tests: a failing test must not
      # discard a 15-minute Rust build and force another cold build on retry.
      - name: Save compiled engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            .tools/cargo-ipad
            Engine/TinymistBridge/target
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Save resolved Swift packages
        if: matrix.platform != 'engine' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: .build/xcode-packages
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      - name: Boot iPad simulator
        id: simulator
        if: matrix.platform == 'simulator'
        timeout-minutes: 3
        run: |
          source scripts/environment.sh
          python3 - <<'PY'
          import json
          import os
          import subprocess
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          runtimes = sorted((runtime for runtime in inventory['devices'] if '.iOS-' in runtime),
                            key=lambda runtime: tuple(map(int, runtime.split('.iOS-')[1].split('-'))), reverse=True)
          devices = []
          for runtime in runtimes:
              devices = [entry for entry in inventory['devices'][runtime] if 'iPad' in entry['name']]
              if devices:
                  break
          if not devices:
              raise SystemExit('No available iPad simulator for native UI tests')
          selected = {}
          for size, label in [('small', '11-inch'), ('large', '13-inch')]:
              matches = [entry for entry in devices if label in entry['name']]
              if not matches:
                  raise SystemExit(f'No available {label} iPad simulator on {runtime}')
              device = sorted(matches, key=lambda entry: entry['name'])[0]
              print(f"Using {device['name']} on {runtime}", flush=True)
              if device['state'] != 'Booted':
                  subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
              selected[size] = device['udid']
          for udid in selected.values():
              subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for size, udid in selected.items():
                  output.write(f"{size}={udid}\n")
          PY
      - name: Native writing, preview navigation, catalog and PDF sharing
        if: matrix.platform == 'simulator'
        timeout-minutes: 12
        env:
          IPAD_SMALL_SIMULATOR_ID: ${{ steps.simulator.outputs.small }}
          IPAD_LARGE_SIMULATOR_ID: ${{ steps.simulator.outputs.large }}
        run: |
          source scripts/environment.sh
          test_bundles=(build/iPad/Build/Products/*.xctestrun)
          test "${#test_bundles[@]}" -eq 1
          test -f "${test_bundles[0]}"
          xcodebuild -xctestrun "${test_bundles[0]}" \
            -destination "platform=iOS Simulator,id=$IPAD_SMALL_SIMULATOR_ID" \
            -destination "platform=iOS Simulator,id=$IPAD_LARGE_SIMULATOR_ID" -destination-timeout 30 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 150 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/iPad-writing.xcresult test-without-building
      - name: Upload native iPad test results
        if: always() && matrix.platform == 'simulator'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-writing
          path: build/iPad-writing.xcresult
          if-no-files-found: warn
          retention-days: 14
