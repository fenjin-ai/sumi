name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: build and test
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Cache Swift package sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/repositories
            .build/checkouts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Functional integration tests and 80% coverage gate
        run: scripts/test.sh
      - name: Agent bridge with one cooperative worker
        run: |
          source scripts/environment.sh
          export SUMI_MCP_HELPER="$(swift build --show-bin-path)/SumiMCP"
          python3 scripts/test-cooperative-pool.py
      - name: Upload application coverage to Codecov
        if: ${{ !cancelled() && hashFiles('build/coverage/codecov.lcov') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Fork PRs use Codecov's public-repository tokenless upload support.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: build/coverage/codecov.lcov
          disable_search: true
          disable_file_fixes: true
          plugins: noop
          fail_ci_if_error: true
          name: macos-apple-silicon
      - name: Real book editing and navigation benchmarks
        run: scripts/benchmark-books.sh
      - name: Upload book performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: book-performance-macos-15
          path: build/benchmarks
          if-no-files-found: warn
          retention-days: 14
      - name: Release build and signature validation
        run: |
          scripts/build.sh release
          codesign --verify --deep --strict build/Sumi.app
          build/Sumi.app/Contents/Helpers/tinymist --version
          source scripts/environment.sh
          python3 scripts/smoke-app.py --development-resources "$(swift build -c release --show-bin-path)/Sumi_SumiCore.bundle"
          ditto -c -k --sequesterRsrc --keepParent build/Sumi.app build/Sumi-CI.zip
      - name: Upload runnable app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-macos-15
          path: build/Sumi-CI.zip
          if-no-files-found: error
          retention-days: 7
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.md ]; then
            cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/benchmarks/summary.md ]; then
            cat build/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-macos-15
          path: build/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Packaged launch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launch-smoke-macos-15
          path: build/launch-smoke
          if-no-files-found: ignore
          retention-days: 14
