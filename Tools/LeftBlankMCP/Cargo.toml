[package]
name = "leftblank-mcp"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "LeftBlankMCP"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
jsonschema = { version = "=0.58.5", default-features = false }
libc = "0.2.177"
plist = "1.8.0"
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "process", "fs"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }

[profile.release]
lto = "thin"
strip = "symbols"
